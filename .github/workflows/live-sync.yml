name: Live Job Market Sync

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-job-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate sync script
        run: node --check scripts/sync-live.js

      - name: Sync active market data
        env:
          SARAMIN_ACCESS_KEY: ${{ secrets.SARAMIN_ACCESS_KEY }}
        run: node scripts/sync-live.js

      - name: Commit updated market snapshot
        run: |
          if git diff --quiet -- data/jobs.json data/history.json; then
            echo "No market data changes to commit."
            exit 0
          fi
          git config user.name "job-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json data/history.json
          git commit -m "data: refresh live job market snapshot"
          git push
