name: Job Signal QA

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check market-trends.js

      - name: Check Vercel function syntax
        run: node --check api/jobs.js

      - name: Check live sync syntax
        run: node --check scripts/sync-live.js

      - name: Validate job datasets
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const files = ['data/jobs.json', 'data/verified-supplement.json'];
          const required = ['id','title','company','category','location','employment','source','url','verified_at'];
          let total = 0;
          const ids = new Set();
          for (const file of files) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!Array.isArray(data.jobs) || !data.jobs.length) throw new Error(`${file}: jobs empty`);
            for (const job of data.jobs) {
              for (const key of required) if (!job[key]) throw new Error(`${file}: ${job.id || 'unknown'} missing ${key}`);
              if (!/^https:\/\//.test(job.url)) throw new Error(`${file}: ${job.id} invalid url`);
              if (ids.has(job.id)) throw new Error(`duplicate id: ${job.id}`);
              ids.add(job.id);
              total++;
            }
          }
          console.log('validated jobs:', total);
          NODE

      - name: Validate trend history store
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const history = JSON.parse(fs.readFileSync('data/history.json', 'utf8'));
          if (!Array.isArray(history.snapshots)) throw new Error('history.snapshots must be an array');
          for (const point of history.snapshots) {
            if (!point.at || !point.markets) throw new Error('invalid history point');
          }
          console.log('history points:', history.snapshots.length);
          NODE

      - name: Validate required frontend hooks
        run: |
          grep -q 'id="searchForm"' index.html
          grep -q 'id="dashboard"' index.html
          grep -q 'id="jobsList"' index.html
          grep -q 'id="coverageNote"' index.html
          grep -q 'id="trendCount"' index.html
          grep -q 'id="trendJunior"' index.html
          grep -q 'id="trendSenior"' index.html
          grep -q 'market-trends.js' index.html
          grep -q 'polish.css' index.html

      - name: Smoke test API handler without external key
        run: |
          node - <<'NODE'
          const handler = require('./api/jobs.js');
          const req = { query: { q: '백엔드' } };
          const headers = {};
          let statusCode = 200;
          const res = {
            setHeader(k,v){ headers[k]=v; },
            status(code){ statusCode=code; return this; },
            json(payload){
              if (statusCode !== 200) throw new Error(`status ${statusCode}`);
              if (!Array.isArray(payload.jobs) || payload.jobs.length < 1) throw new Error('no jobs');
              if (!payload.jobs.some(j => j.source === '사람인')) throw new Error('supplement not merged');
              console.log('api jobs:', payload.jobs.length);
            }
          };
          Promise.resolve(handler(req,res)).catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Smoke test live sync without secret
        run: node scripts/sync-live.js
